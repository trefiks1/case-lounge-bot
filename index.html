<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо Удачи</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .balance {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
        .prize-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .prize-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .prize-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .prize-card span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
        }
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }
        button:active {
            transform: scale(0.95);
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Кейс Удачи</h2>
        <div class="balance">Баланс: <span id="balance">1000</span> монет</div>

        <div class="prize-grid">
            <div class="prize-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2534/2534195.png" alt="x2">
                <span>x2</span>
            </div>
            <div class="prize-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2534/2534204.png" alt="x5">
                <span>x5</span>
            </div>
            <div class="prize-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2534/2534211.png" alt="x10">
                <span>x10</span>
            </div>
            <div class="prize-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2534/2534218.png" alt="x25">
                <span>x25</span>
            </div>
            <div class="prize-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2534/2534233.png" alt="x50">
                <span>x50</span>
            </div>
            <div class="prize-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2534/2534245.png" alt="x100">
                <span>x100</span>
            </div>
        </div>

        <button onclick="openCase()">Открыть за 100 монет</button>
        <div id="result"></div>
    </div>

    <script>
        let balance = 1000;
        const cost = 100;

        // Возможные множители и их «веса» (шансы выпадения, в сумме 100)
        const prizes = [
            { multiplier: 2, chance: 50, text: 'x2' },
            { multiplier: 5, chance: 25, text: 'x5' },
            { multiplier: 10, chance: 15, text: 'x10' },
            { multiplier: 25, chance: 7, text: 'x25' },
            { multiplier: 50, chance: 2, text: 'x50' },
            { multiplier: 100, chance: 1, text: 'x100' }
        ];

        function openCase() {
            const balanceElem = document.getElementById('balance');
            const resultElem = document.getElementById('result');

            if (balance < cost) {
                resultElem.innerHTML = "<span style='color: #ff416c;'>Недостаточно средств!</span>";
                return;
            }

            // Списываем стоимость открытия
            balance -= cost;
            balanceElem.innerText = balance;
            resultElem.innerHTML = "Кейс открывается...";

            // Рандом по шансам
            let randomNum = Math.random() * 100;
            let cumulativeChance = 0;
            let winningPrize = prizes[0];

            for (let prize of prizes) {
                cumulativeChance += prize.chance;
                if (randomNum <= cumulativeChance) {
                    winningPrize = prize;
                    break;
                }
            }

            // Вычисляем выигрыш
            setTimeout(() => {
                let winAmount = cost * winningPrize.multiplier;
                balance += winAmount;
                balanceElem.innerText = balance;
                resultElem.innerHTML = `Вы выиграли <b>${winningPrize.text}</b>! (+${winAmount} монет)`;
            }, 1000);
        }
    </script>

</body>
</html>
